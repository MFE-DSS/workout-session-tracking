# Alembic configuration for Workout Session Tracking.
#
# The actual SQLAlchemy URL is read from `app.config.get_settings()`
# inside migrations/env.py — there is no hardcoded URL here so a
# single DATABASE_URL env var drives both runtime and migrations.

[alembic]
script_location = migrations
prepend_sys_path = .

# Timestamped filenames make it easier to see migration history in
# the versions/ folder.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Treat revision timestamps as UTC.
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
