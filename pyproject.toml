[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workout-session-tracking"
version = "0.1.0"
description = "Mobile-first web app to log hypertrophy split sessions (FastAPI SSR, SQLite -> PostgreSQL ready)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# Sb_20.1 — Coverage configuration consumed by pytest-cov + SonarCloud.
# Local pytest runs are NOT auto-instrumented; activate via
# `pytest --cov=app --cov-report=term-missing` when measuring locally.
# CI always runs with --cov to produce coverage.xml for SonarCloud.
[tool.coverage.run]
source = ["app"]
branch = false
omit = [
    "app/__init__.py",
    # Migration scripts are not application logic.
    "migrations/*",
    # Test fixtures live under tests/, never count for app coverage.
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
