[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workout-session-tracking"
version = "0.1.0"
description = "Mobile-first web app to log hypertrophy split sessions (FastAPI SSR, SQLite -> PostgreSQL ready)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.5",
    "httpx>=0.27",
    # Sb_20.2 — linters CI (advisory, non-blocking V1).
    "ruff>=0.5",
    "bandit>=1.7",
]

# Sb_UI_11.1 — Visual baseline tooling (Playwright).
# Installed on demand: `pip install -e '.[baseline]'` then
# `python -m playwright install chromium`. Never installed in CI V1 — CI
# only validates matrix + CLI logic without launching a browser.
# See docs/strategy/Sx_UI_11_SCREENSHOT_REGRESSION_BASELINE_SPEC.md §4.
baseline = [
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# Sb_20.1 — Coverage configuration consumed by pytest-cov + SonarCloud.
# Local pytest runs are NOT auto-instrumented; activate via
# `pytest --cov=app --cov-report=term-missing` when measuring locally.
# CI always runs with --cov to produce coverage.xml for SonarCloud.
[tool.coverage.run]
source = ["app"]
branch = false
omit = [
    "app/__init__.py",
    # Migration scripts are not application logic.
    "migrations/*",
    # Test fixtures live under tests/, never count for app coverage.
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# Sb_20.2 — Ruff configuration. Advisory in CI V1; will become a gate
# once Sb_20.5 turns on the SonarCloud Quality Gate as required check.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", "var", ".venv", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, undefined names)
    "W",    # pycodestyle warnings
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade (modern Python idioms)
    "S",    # flake8-bandit (security subset via ruff)
    "C90",  # mccabe complexity
]
ignore = [
    "E501",   # line too long — formatter decides
    "S101",   # asserts are fine (caught per-file below for tests)
    "S104",   # binding 0.0.0.0 — uvicorn dev pattern
    "B008",   # FastAPI Annotated[..., Form()] = pattern triggers this
    "UP007",  # X | Y union syntax — keep Optional[X] readable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "C90"]      # tests use asserts, simple flow
"scripts/*" = ["S603", "S607"]      # subprocess in CLI scripts is fine
"migrations/*" = ["E", "F", "W", "I", "B", "UP", "S", "C90"]  # alembic-gen
"app/__init__.py" = ["F401"]        # re-exports

[tool.ruff.lint.mccabe]
max-complexity = 15

# Sb_20.2 — Bandit (security-focused SAST). Advisory in CI V1.
[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv", "var", "data"]
# B101 = assert_used (already covered by ruff S101)
# B311 = pseudo-random — not used for crypto here
skips = ["B101", "B311"]
