{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Créer un programme</h1>

{% if error %}
  <p class="pd-error">{{ error }}</p>
{% endif %}

<form method="post" action="{{ url_for('user_program_create') }}" class="card form-panel">
  <div class="field">
    <label class="field__label" for="title">Titre du programme</label>
    <input type="text" id="title" name="title" required maxlength="128"
           value="{{ title_value }}" class="field__input"
           placeholder="Mon programme hypertrophie" />
  </div>
  <button type="submit" class="btn btn--primary pd-block">Créer</button>
</form>

<p class="page-back">
  <a class="btn btn--ghost" href="{{ url_for('user_programs_list') }}">← Mes programmes</a>
</p>
{% endblock %}
