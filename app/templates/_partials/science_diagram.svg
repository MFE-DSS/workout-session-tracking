<svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="diagram-title diagram-desc"
     style="width:100%;height:auto;max-width:800px;display:block;margin:0 auto;">
  <title id="diagram-title">Architecture des modules Auren</title>
  <desc id="diagram-desc">
    Programmes alimente Seance. Seance alimente Historique. Historique alimente
    Synthese, Physique et Classement. Etat du jour et Mesures alimentent
    Synthese et Physique. Les donnees privees (mesures, etat du jour) ne sont
    jamais partagees dans Classement.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3ad" />
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7785" />
    </marker>
  </defs>

  <!-- Row 1: inputs -->
  <g>
    <rect x="40" y="40" width="140" height="50" rx="8"
          fill="#161a22" stroke="#f25f3a" stroke-width="2" />
    <text x="110" y="70" text-anchor="middle" fill="#e8ecf1"
          font-family="JetBrains Mono, monospace" font-size="12">Programmes</text>

    <rect x="330" y="40" width="140" height="50" rx="8"
          fill="#161a22" stroke="#6e7785" stroke-width="1" stroke-dasharray="4 3" />
    <text x="400" y="64" text-anchor="middle" fill="#e8ecf1"
          font-family="JetBrains Mono, monospace" font-size="12">Etat du jour</text>
    <text x="400" y="80" text-anchor="middle" fill="#6e7785"
          font-family="Inter, sans-serif" font-size="10">prive</text>

    <rect x="620" y="40" width="140" height="50" rx="8"
          fill="#161a22" stroke="#6e7785" stroke-width="1" stroke-dasharray="4 3" />
    <text x="690" y="64" text-anchor="middle" fill="#e8ecf1"
          font-family="JetBrains Mono, monospace" font-size="12">Mesures</text>
    <text x="690" y="80" text-anchor="middle" fill="#6e7785"
          font-family="Inter, sans-serif" font-size="10">prive</text>
  </g>

  <!-- Row 2: Seance -->
  <g>
    <rect x="330" y="170" width="140" height="50" rx="8"
          fill="#161a22" stroke="#f25f3a" stroke-width="2" />
    <text x="400" y="200" text-anchor="middle" fill="#e8ecf1"
          font-family="JetBrains Mono, monospace" font-size="12">Seance</text>
  </g>

  <!-- Row 3: Historique -->
  <g>
    <rect x="330" y="280" width="140" height="50" rx="8"
          fill="#161a22" stroke="#232834" stroke-width="1" />
    <text x="400" y="310" text-anchor="middle" fill="#e8ecf1"
          font-family="JetBrains Mono, monospace" font-size="12">Historique</text>
  </g>

  <!-- Row 4: outputs (3 synthesis surfaces) -->
  <g>
    <rect x="60" y="400" width="200" height="74" rx="8"
          fill="#161a22" stroke="#232834" stroke-width="1" />
    <text x="160" y="424" text-anchor="middle" fill="#e8ecf1"
          font-family="JetBrains Mono, monospace" font-size="12">Synthese</text>
    <text x="160" y="444" text-anchor="middle" fill="#9aa3ad"
          font-family="Inter, sans-serif" font-size="10">5 axes · confiance</text>
    <text x="160" y="460" text-anchor="middle" fill="#6e7785"
          font-family="Inter, sans-serif" font-size="10">seances + etat + mesures</text>

    <rect x="300" y="400" width="200" height="74" rx="8"
          fill="#161a22" stroke="#232834" stroke-width="1" />
    <text x="400" y="424" text-anchor="middle" fill="#e8ecf1"
          font-family="JetBrains Mono, monospace" font-size="12">Physique</text>
    <text x="400" y="444" text-anchor="middle" fill="#9aa3ad"
          font-family="Inter, sans-serif" font-size="10">11 zones · equilibre</text>
    <text x="400" y="460" text-anchor="middle" fill="#6e7785"
          font-family="Inter, sans-serif" font-size="10">volume par zone + mesures</text>

    <rect x="540" y="400" width="200" height="74" rx="8"
          fill="#161a22" stroke="#232834" stroke-width="1" />
    <text x="640" y="424" text-anchor="middle" fill="#e8ecf1"
          font-family="JetBrains Mono, monospace" font-size="12">Classement</text>
    <text x="640" y="444" text-anchor="middle" fill="#9aa3ad"
          font-family="Inter, sans-serif" font-size="10">qualite x completion</text>
    <text x="640" y="460" text-anchor="middle" fill="#6e7785"
          font-family="Inter, sans-serif" font-size="10">seances uniquement</text>
  </g>

  <!-- Edges: inputs -> seance/outputs -->
  <line x1="110" y1="90" x2="380" y2="170" stroke="#9aa3ad" stroke-width="1" marker-end="url(#arrow)" />
  <path d="M 380 90 Q 260 240 180 400" fill="none" stroke="#6e7785" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-dim)" />
  <path d="M 680 90 Q 540 240 420 400" fill="none" stroke="#6e7785" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-dim)" />

  <!-- Seance -> Historique -->
  <line x1="400" y1="220" x2="400" y2="280" stroke="#9aa3ad" stroke-width="1" marker-end="url(#arrow)" />

  <!-- Historique -> 3 outputs -->
  <line x1="360" y1="330" x2="180" y2="400" stroke="#9aa3ad" stroke-width="1" marker-end="url(#arrow)" />
  <line x1="400" y1="330" x2="400" y2="400" stroke="#9aa3ad" stroke-width="1" marker-end="url(#arrow)" />
  <line x1="440" y1="330" x2="620" y2="400" stroke="#9aa3ad" stroke-width="1" marker-end="url(#arrow)" />

  <!-- Legend -->
  <g transform="translate(60, 510)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#9aa3ad" stroke-width="1" marker-end="url(#arrow)" />
    <text x="38" y="4" fill="#9aa3ad" font-family="Inter, sans-serif" font-size="11">flux principal</text>
    <line x1="180" y1="0" x2="210" y2="0" stroke="#6e7785" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-dim)" />
    <text x="218" y="4" fill="#6e7785" font-family="Inter, sans-serif" font-size="11">donnee privee</text>
  </g>
</svg>
