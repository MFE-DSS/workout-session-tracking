{% extends "base.html" %}
{% block content %}
<h1 class="h1">Changer le mot de passe</h1>

{% if success %}
  <div class="card" style="border-left: 4px solid var(--ok); margin-bottom: 16px;">
    <p style="color: var(--ok); font-weight: 700;">Mot de passe mis à jour avec succès.</p>
  </div>
{% endif %}

{% if error %}
  <div class="integrity-errors" style="margin-bottom: 16px;">
    <b>{{ error }}</b>
  </div>
{% endif %}

<form method="post" action="{{ url_for('password_change_submit') }}" class="card">
  <label class="field">
    <span class="field__label">Mot de passe actuel</span>
    <input type="password" name="current_password" required autocomplete="current-password" />
  </label>
  <label class="field">
    <span class="field__label">Nouveau mot de passe</span>
    <input type="password" name="new_password" required autocomplete="new-password" minlength="4" />
  </label>
  <label class="field">
    <span class="field__label">Confirmer le nouveau mot de passe</span>
    <input type="password" name="new_password_confirm" required autocomplete="new-password" />
  </label>
  <div class="card__actions" style="margin-top: 16px;">
    <button type="submit" class="btn btn--primary btn--wide">Mettre à jour</button>
  </div>
</form>

<p style="margin-top: 16px;">
  <a href="{{ url_for('profile_page') }}" style="color: var(--fg-dim); font-size: 13px;">
    ← Retour au profil
  </a>
</p>
{% endblock %}
