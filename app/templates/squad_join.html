{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Rejoindre une squad</h1>

{% if error %}
  <p class="pd-error">{{ error }}</p>
{% endif %}

<form method="post" action="{{ url_for('squad_join_post') }}" class="card sq-panel">
  <div class="field">
    <label class="field__label" for="code">Code d'invitation</label>
    <input type="text" id="code" name="code" required placeholder="SPGN-XXXX" class="field__input sq-code" />
  </div>
  <button type="submit" class="btn btn--primary pd-block">Rejoindre</button>
</form>

<p class="sq-back">
  <a class="btn btn--ghost" href="{{ url_for('squads_list') }}">← Retour</a>
</p>
{% endblock %}
