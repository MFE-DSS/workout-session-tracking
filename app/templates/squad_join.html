{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Rejoindre une squad</h1>

{% if error %}
  <p style="color:var(--c-danger, #e74c3c); margin-bottom:1rem;">{{ error }}</p>
{% endif %}

<form method="post" action="{{ url_for('squad_join_post') }}" class="card" style="max-width:28rem;">
  <div class="field">
    <label class="field__label" for="code">Code d'invitation</label>
    <input type="text" id="code" name="code" required placeholder="SPGN-XXXX" style="text-transform:uppercase;" class="field__input" />
  </div>
  <button type="submit" class="btn btn--primary" style="margin-top:1rem;">Rejoindre</button>
</form>

<p style="margin-top:1.5rem;">
  <a class="btn btn--ghost" href="{{ url_for('squads_list') }}">← Retour</a>
</p>
{% endblock %}
