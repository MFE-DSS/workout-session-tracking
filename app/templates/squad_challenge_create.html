{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Nouveau challenge &middot; {{ squad.name }}</h1>

{% if error %}
  <p style="color:var(--danger); font-weight:600;">{{ error }}</p>
{% endif %}

<form method="post" action="{{ url_for('squad_challenge_create_post', squad_id=squad.id) }}" class="card" style="max-width:28rem;">
  <div style="margin-bottom:1rem;">
    <label for="title"><strong>Titre</strong></label><br>
    <input type="text" id="title" name="title" required style="width:100%;">
  </div>
  <div style="margin-bottom:1rem;">
    <label for="metric"><strong>Métrique</strong></label><br>
    <select id="metric" name="metric" required style="width:100%;">
      {% for key, label in metric_labels.items() %}
        <option value="{{ key }}">{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div style="margin-bottom:1rem;">
    <label for="starts_at"><strong>Date de début</strong></label><br>
    <input type="date" id="starts_at" name="starts_at" required style="width:100%;">
  </div>
  <div style="margin-bottom:1rem;">
    <label for="ends_at"><strong>Date de fin</strong></label><br>
    <input type="date" id="ends_at" name="ends_at" required style="width:100%;">
  </div>
  <button type="submit" class="btn btn--primary">Créer le challenge</button>
</form>

<p style="margin-top:1.5rem;">
  <a class="btn btn--ghost" href="{{ url_for('squad_challenges', squad_id=squad.id) }}">&larr; Retour aux challenges</a>
</p>
{% endblock %}
