{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Créer une squad</h1>

{% if error %}
  <p class="pd-error">{{ error }}</p>
{% endif %}

<form method="post" action="{{ url_for('squad_create_post') }}" class="card form-panel">
  <div class="field">
    <label class="field__label" for="name">Nom de la squad</label>
    <input type="text" id="name" name="name" required maxlength="64" class="field__input" />
  </div>
  <button type="submit" class="btn btn--primary pd-block">Créer</button>
</form>

<p class="page-back">
  <a class="btn btn--ghost" href="{{ url_for('squads_list') }}">← Retour</a>
</p>
{% endblock %}
