<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
    <title>Inscription · Workout</title>
  </head>
  <body>
    <main class="container" style="padding-top: 60px;">
      <div class="auth-container">
        <h1 class="page-title">Inscription</h1>

        {% if error %}
          <div class="integrity-errors">
            <b>{{ error }}</b>
          </div>
        {% endif %}

        <form method="post" action="{{ url_for('register_submit') }}" class="card">
          <label class="field">
            <span class="field__label">Nom d'utilisateur</span>
            <input type="text" name="username" required autofocus autocomplete="username" minlength="3" />
          </label>
          <label class="field">
            <span class="field__label">Mot de passe</span>
            <input type="password" name="password" required autocomplete="new-password" minlength="4" />
          </label>
          <label class="field">
            <span class="field__label">Confirmer le mot de passe</span>
            <input type="password" name="password_confirm" required autocomplete="new-password" />
          </label>
          <div class="card__actions" style="margin-top: 16px;">
            <button type="submit" class="btn btn--primary btn--wide">Créer le compte</button>
          </div>
        </form>

        <p style="text-align: center; margin-top: 16px;">
          <a href="{{ url_for('login_page') }}" style="color: var(--fg-dim); font-size: 13px;">
            Déjà un compte ? Se connecter
          </a>
        </p>
      </div>
    </main>
  </body>
</html>
