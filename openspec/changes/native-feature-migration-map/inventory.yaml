# MOB-00 — inventaire des fonctions web et de leur destination native.
#
# Source des routes : `app.routes` à `36b971a` (110 routes d'API, 18 modules), jamais une mémoire.
# Une entrée = une FONCTION UTILISATEUR ; chaque route montée appartient à exactement une entrée
# (garde : tests/test_native_feature_migration_map.py).
#
# status : KEEP_DOMAIN (domaine serveur gardé, interface native déjà là ou réécrite)
#        · REWRITE_NATIVE (à réécrire en natif sur le domaine existant)
#        · WEB_ONLY (reste sur le web) · DEPRECATE (à retirer) · BLOCKED (dépendance nommée).
# proposed: true = proposition de l'agent, à trancher par l'opérateur (DEPRECATE / WEB_ONLY).
# native_destination : hypothèse de navigation MISSION · SÉANCE · PROGRÈS · PROFIL (non verrouillée,
# décidée par MOB-01) ; « Compte » vit sous PROFIL.

version: 1
base_sha: 36b971a
excluded_routes:  # montés par FastAPI, pas des fonctions utilisateur (désactivés en production)
  - GET /openapi.json
  - GET /api/docs
  - GET /docs/oauth2-redirect
  - MOUNT /static

features:

  # ── Séance (déjà native) ────────────────────────────────────────────────────
  - id: mission-today
    feature: MISSION — la séance du jour et sa raison
    family: mission
    routes: [GET /, GET /api/mobile/v1/mission]
    legacy_location: "pages.index → index.html ; mobile_api.mission"
    domain_owner: [recommendation_v3, home, mobile_read_models.mission_read_model, session_state]
    api: "GET /api/mobile/v1/mission (existe)"
    data: [workout_sessions, recommendation_episodes, decision_traces, training_preferences]
    user_actions: [voir la séance proposée, lire la raison, choisir une alternative, démarrer]
    native_destination: MISSION (MissionScreen, livré)
    status: KEEP_DOMAIN
    dependencies: []
    visual_assets: [MISSION-SCREEN-V1, BODYMAP-ZONES-V1]
    migration_risk: "faible — livré ; constat PLAT-01 : raison « déjà bien servi » affichée MESURÉE sur un compte sans séance"

  - id: plan-adaptation-dismiss
    feature: Écarter une adaptation de plan proposée
    family: mission
    routes: [POST /plan-adaptations/dismiss]
    legacy_location: "plan_adaptation.dismiss → retour accueil"
    domain_owner: [plan_adaptation_store]
    api: "à créer (commande JSON)"
    data: [plan_adaptation_dismissals]
    user_actions: [écarter une adaptation]
    native_destination: MISSION
    status: REWRITE_NATIVE
    dependencies: [MOB-04 Mission]
    visual_assets: []
    migration_risk: faible

  - id: session-execution
    feature: Exécuter une séance (démarrer, séries, repos, substitution, terminer, abandonner)
    family: seance
    routes:
      - POST /sessions
      - GET /sessions/{session_id}
      - POST /sessions/{session_id}
      - POST /sessions/{session_id}/exercises/{session_exercise_id}
      - POST /sessions/{session_id}/exercises/{session_exercise_id}/rest/skip
      - POST /api/mobile/v1/sessions
      - GET /api/mobile/v1/sessions/{session_id}/execution
      - PUT /api/mobile/v1/sessions/{session_id}/sets/{set_id}
      - POST /api/mobile/v1/sessions/{session_id}/exercises/{se_id}/substitute
      - POST /api/mobile/v1/sessions/{session_id}/finish
      - POST /api/mobile/v1/sessions/{session_id}/abandon
    legacy_location: "sessions.* → session_detail.html, _partials/exercise_card.html, rest_timer.html ; mobile_api.*"
    domain_owner: [session_builder, console_state, substitution, overload_engine, environment_activation, mobile_read_models]
    api: "/api/mobile/v1/sessions/* (existe)"
    data: [workout_sessions, session_exercises, set_logs]
    user_actions: [démarrer, saisir charge et répétitions, valider, repos, passer, remplacer, terminer, abandonner, reprendre]
    native_destination: SÉANCE (ExecutionScreen, ResumeScreen, livrés)
    status: KEEP_DOMAIN
    dependencies: [MOB-02 intégration de séance (hors chemin heureux), E7 pour l'instrument de charge]
    visual_assets: [EXECUTION-SCREEN-V1, SESSION-CARD-R1 (attend E7)]
    migration_risk: "moyen — reprise, hors ligne et substitution à durcir (MOB-02)"

  - id: session-recap
    feature: Bilan de fin de séance
    family: seance
    routes: ["GET /sessions/{session_id}/done"]
    legacy_location: "sessions.done → session_done.html"
    domain_owner: [session_recap, stats, session_completion]
    api: "partiel — le bilan natif se calcule sur l'appareil ; historique et rythme hebdomadaire absents (history=null)"
    data: [workout_sessions, set_logs]
    user_actions: [lire le bilan, voir la prochaine séance]
    native_destination: SÉANCE (CompleteScreen, livré)
    status: KEEP_DOMAIN
    dependencies: [read model d'historique pour la comparaison « à toi-même »]
    visual_assets: [COMPLETE-SCREEN-V1]
    migration_risk: faible

