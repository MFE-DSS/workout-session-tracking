# SonarQube / SonarCloud configuration
# Minimal config to separate sources from tests and reduce false-positive
# security hotspots on test fixtures (hardcoded credentials, signing keys).

sonar.projectKey=workout-session-tracking
sonar.projectName=Workout Session Tracking
sonar.organization=mfe-dss

# Sb_20.4 — Python target version. Lets Sonar disable rules that don't
# apply to 3.11 (e.g. legacy 2.x compat suggestions).
sonar.python.version=3.11

# Source layout
sonar.sources=app
sonar.tests=tests

# Sb_20.1 — Coverage report (Cobertura format from pytest-cov).
sonar.python.coverage.reportPaths=coverage.xml

# Sb_20.4 — External report ingestion. Sonar enriches its analysis with
# ruff + bandit findings instead of re-running them, so the gate stays
# coherent with the linters job.
sonar.python.ruff.reportPaths=ruff-report.json
sonar.python.bandit.reportPaths=bandit-report.json

# Exclude non-source trees from analysis
sonar.exclusions=migrations/**,scripts/**,deploy/**,data/**,var/**,**/__pycache__/**

# Test file pattern — helps Sonar apply relaxed security rules to test code
sonar.test.inclusions=tests/**/*.py

# Sb_20.4 — Coverage exclusions mirror [tool.coverage.run] omit list.
sonar.coverage.exclusions=app/__init__.py,migrations/**,tests/**,scripts/**

# Sb_20.4 — Source encoding. Default is platform-dependent; pin to UTF-8.
sonar.sourceEncoding=UTF-8
