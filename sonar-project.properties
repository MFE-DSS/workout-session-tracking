# SonarQube / SonarCloud configuration
# Minimal config to separate sources from tests and reduce false-positive
# security hotspots on test fixtures (hardcoded credentials, signing keys).

sonar.projectKey=workout-session-tracking
sonar.projectName=Workout Session Tracking

# Source layout
sonar.sources=app
sonar.tests=tests

# Python coverage (if generated)
sonar.python.coverage.reportPaths=coverage.xml

# Exclude non-source trees from analysis
sonar.exclusions=migrations/**,scripts/**,deploy/**,data/**,var/**

# Test file pattern — helps Sonar apply relaxed security rules to test code
sonar.test.inclusions=tests/**/*.py
