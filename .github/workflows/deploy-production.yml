name: Deploy production

on:
  workflow_dispatch:
    inputs:
      # Sb_OPS_DEPLOY_SAFETY_01 — NO default. It used to be "main", a branch that does not exist
      # in this repo (the trunk is claude/sprint-reporting-fitness-app-V7Qr6), so a default
      # dispatch failed at checkout. We deliberately do NOT swap in the canonical branch either:
      # a branch default deploys a MOVING tip, whereas this repo's discipline is to deploy the
      # exact SHA that CI validated. Leaving it empty forces a conscious, explicit choice.
      ref:
        description: "EXACT full SHA to deploy (40 hex chars). A branch name is accepted but discouraged — prefer the SHA CI validated."
        required: true
      skip_smoke:
        description: "Skip smoke_deploy.sh (emergency only — leaves prod unvalidated)."
        required: false
        type: boolean
        default: false

# contents: write is required to push the deploy/prod/<tag> back to origin.
# We grant nothing else — no issues, no PRs, no packages.
permissions:
  contents: write

# Serialize deploys. Two dispatches in flight wait for each other; they
# do not cancel. In-flight prod deploys are never cancelled mid-run.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy on OVH VPS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Fetch full history so we can resolve the ref to a full SHA
          # and push the deploy tag back to origin.
          fetch-depth: 0

      - name: Resolve full SHA
        id: sha
        run: |
          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "full=$FULL_SHA"   >> "$GITHUB_OUTPUT"
          echo "short=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Requested ref : ${{ inputs.ref }}"
          echo "Resolved SHA  : $FULL_SHA ($SHORT_SHA)"
          # Sb_OPS_DEPLOY_SAFETY_01 — make a moving-tip deploy visible in the log rather than
          # silent. The exact-SHA path stays fully supported and is the recommended one.
          if [ "${{ inputs.ref }}" != "$FULL_SHA" ]; then
            echo "::warning::Deployed ref '${{ inputs.ref }}' is not a full SHA; it resolved to $FULL_SHA at dispatch time."
          fi

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"         > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Run deploy_from_github_actions.sh on VPS
        id: push_to_vps
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          FULL_SHA: ${{ steps.sha.outputs.full }}
        run: |
          ssh \
            -i ~/.ssh/id_deploy \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /opt/workout-session-tracking/scripts/deploy_from_github_actions.sh $FULL_SHA"

      - name: Run smoke_deploy.sh on VPS
        id: smoke
        if: ${{ inputs.skip_smoke == false }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_deploy \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -u ubuntu bash /opt/workout-session-tracking/scripts/smoke_deploy.sh"

      - name: Tag successful deploy
        if: ${{ success() }}
        env:
          FULL_SHA: ${{ steps.sha.outputs.full }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          TAG="deploy/prod/$(date -u +%Y-%m-%d-%H%M)-${SHORT_SHA}"
          echo "Tagging $TAG → $FULL_SHA"
          git config user.email "deploy-bot@github-actions"
          git config user.name  "deploy-bot"
          git tag -a "$TAG" -m "Deployed $FULL_SHA to production via Actions" "$FULL_SHA"
          git push origin "$TAG"
          echo "::notice title=Deploy tagged::$TAG"

      # Sb_OPS_DEPLOY_FAILURE_HONESTY_01 — un rapport d'échec ne DÉDUIT pas
      # l'état de la production, il le LIT dans le résultat des étapes.
      #
      # ⚠ CE QUI S'EST PASSÉ, ET QUI A MOTIVÉ CETTE TRANCHE.
      #
      # Le 2026-09-06, un dispatch a échoué au CHECKOUT — un SHA court là où
      # l'entrée exige 40 caractères. Les étapes SSH ont été `skipped` : le VPS
      # n'a jamais été contacté. Le rapport a pourtant annoncé :
      #
      #     X SHA  — VPS left in partial state, investigate via SSH.
      #
      # Deux mensonges dans une seule ligne. Il affirmait un état partiel de la
      # PRODUCTION alors qu'aucun octet n'avait quitté le runner, et il
      # imprimait un SHA VIDE parce que `steps.sha` n'avait pas tourné. Une
      # personne qui lit ça de bonne foi ouvre une session SSH sur la prod pour
      # enquêter sur une panne qui n'existe pas — au pire moment, celui où elle
      # croit une livraison à moitié posée.
      #
      # Un rapport d'échec est lu quand la confiance est déjà entamée. C'est
      # exactement là qu'il ne doit rien inventer.
      #
      # Les trois cas sont désormais distingués par le RÉSULTAT des étapes,
      # jamais par une hypothèse :
      #   · le poussage n'a pas eu lieu   → la production est INTACTE
      #   · le poussage a échoué          → elle peut être à moitié posée
      #   · le poussage a réussi, le smoke a échoué → le code EST en place et
      #     ne répond pas : c'est le seul cas où le rollback presse.
      - name: Report failure
        if: ${{ failure() }}
        env:
          FULL_SHA: ${{ steps.sha.outputs.full }}
          REF_DEMANDE: ${{ inputs.ref }}
          POUSSAGE: ${{ steps.push_to_vps.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          # `steps.sha` peut n'avoir jamais tourné : on retombe sur la réf
          # demandée plutôt que d'imprimer un blanc.
          CIBLE="${FULL_SHA:-$REF_DEMANDE}"
          CIBLE="${CIBLE:-<aucune réf résolue>}"

          case "$POUSSAGE" in
            success)
              if [ "$SMOKE" = "failure" ]; then
                ETAT="le code EST déployé sur le VPS et le smoke test a échoué — la production répond mal"
                SUITE="Rollback URGENT : relancer ce workflow avec ref=<SHA-précédent-complet>."
              else
                ETAT="le poussage a réussi ; l'échec est postérieur (marquage du tag)"
                SUITE="La production tourne sur $CIBLE. Aucun rollback requis pour cet échec."
              fi
              ;;
            failure)
              ETAT="le poussage sur le VPS a ÉCHOUÉ EN COURS — la production peut être à moitié posée"
              SUITE="Vérifier via SSH, puis rollback avec ref=<SHA-précédent-complet> si nécessaire."
              ;;
            *)
              # Une étape jamais atteinte rend une issue VIDE, pas « skipped ».
              # Sans ce repli le message affichait « étape «  » », qui donne
              # l'air d'un bogue là où l'on veut inspirer confiance.
              ETAT="le VPS n'a JAMAIS été contacté (étape « ${POUSSAGE:-jamais atteinte} ») — la production est INTACTE"
              SUITE="Rien à réparer côté production. Corriger le dispatch et relancer. Rappel : l'entrée « ref » attend un SHA COMPLET de 40 caractères."
              ;;
          esac

          echo "::error title=Deploy failed::$CIBLE — $ETAT"
          echo "$SUITE"
          exit 1
