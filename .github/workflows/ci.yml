name: CI

on:
  pull_request:
  push:
    # Sb_20.4 — branche par défaut du repo (pas de `main` distant ; cette
    # branche fait office de trunk). À ajuster si on renomme un jour.
    # `main` retiré le 2026-09-03 : la branche n'existe PAS sur le remote
    # (`git ls-remote --heads origin main` ne rend rien). Config morte.
    branches: [claude/sprint-reporting-fitness-app-V7Qr6]
    # Sb_OPS.ci-path-filter — skip CI on docs-only pushes. Un push dont
    # TOUS les fichiers sont sous docs/ ne déclenche pas ce workflow ; il
    # suffit qu'un seul fichier hors docs/ change pour que la CI joue.
    # Trigger `pull_request` NON affecté : toute PR déclenche CI complète.
    paths-ignore:
      - 'docs/**'

# Read-only: this workflow never touches prod, never pushes tags,
# never deploys. Deployment lives in deploy-production.yml.
permissions:
  contents: read

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # Sx_CI_CANONICAL_DEDUP_01 — ne pas recalculer le même verdict.
  #
  # MESURÉ sur 60 runs (2026-08-23 → 08-31) : le re-run canonique après merge
  # consomme 39 % de tout le temps de runner, et sur les 20 derniers merges
  # **19 rejouaient un arbre identique À L'OCTET** à celui que la CI de PR
  # venait de valider. Une exécution sur un arbre identique ne peut pas, par
  # construction, produire une information susceptible de changer le verdict.
  #
  # Ce job ne tourne QUE sur `push`. Sur une PR il est ignoré, et les shards
  # tournent comme avant — leur `if:` le prévoit explicitement.
  #
  # ⚠ LA PROTECTION DE BRANCHE NE GARANTIT RIEN ICI. Mesuré le 2026-09-01 :
  # `strict = false` (GitHub n'exige pas qu'une branche soit à jour avant
  # merge), `enforce_admins = false`, aucune revue requise, push direct non
  # bloqué. Le taux de 19/20 est une CONSÉQUENCE de l'usage séquentiel, pas un
  # invariant appliqué — la vérification d'arbre ne peut donc jamais être
  # sautée. Elle EST le garde-fou.
  # ════════════════════════════════════════════════════════════════════════
  canonical-attestation:
    name: canonical attestation
    # ⚠ AUCUNE CONDITION ICI, ET C'EST DÉLIBÉRÉ.
    #
    # Première écriture : `if: github.event_name == 'push'`. Le job était donc
    # IGNORÉ sur une PR — et cet état SE PROPAGE dans le graphe. Mesuré sur la
    # CI réelle (run 33534376497) : **`SonarCloud`, contrôle REQUIS par la
    # protection de branche, a cessé de rendre un verdict.** C'est exactement
    # ce que le critère `A7` de l'ordre interdit.
    #
    # Rescaper `sonar` avec `always()` aurait masqué la cause. On la supprime :
    # le job tourne partout, et le script répond `FULL` hors `push`. Le graphe
    # ne contient donc plus aucun job ignoré, et toute la classe de problème
    # disparaît. Coût : ~10 s par run de PR.
    #
    # Ce défaut n'était visible NI en local NI dans le YAML. Seule la CI réelle
    # pouvait le montrer — c'est la raison d'être du tier `ci_infra`.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Least privilege : lire les runs pour vérifier que la PR était verte.
    permissions:
      contents: read
      actions: read
    outputs:
      # `would_reuse` est la PRÉDICTION ; `skip_shards` est la seule sortie qui
      # agit. Elles diffèrent tant que la réutilisation n'est pas armée — c'est
      # tout l'objet du shadow mode.
      would_reuse: ${{ steps.attest.outputs.would_reuse }}
      skip_shards: ${{ steps.attest.outputs.skip_shards }}
      armed: ${{ steps.attest.outputs.armed }}
      reason: ${{ steps.attest.outputs.reason }}
      attested_run_id: ${{ steps.attest.outputs.attested_run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # L'attestation compare des objets ARBRE et remonte aux parents du
          # merge : elle a besoin de l'historique.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Attest
        id: attest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # Sur une PR, ce job CAPTURE ce qui est réellement testé. Le checkout
          # d'un événement `pull_request` est `refs/pull/N/merge`, donc `HEAD`
          # EST le contenu que les shards vont exécuter.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Absente ou ≠ `true` → SHADOW MODE : le verdict est calculé et
          # journalisé, la suite complète tourne quand même. L'armer est une
          # décision d'opérateur, réversible sans toucher au code.
          CI_CANONICAL_REUSE_ENABLED: ${{ vars.CI_CANONICAL_REUSE_ENABLED }}
        # Stdlib uniquement, aucune dépendance installée : ce job doit rester
        # le moins cher et le moins fragile du pipeline. Il échoue FERMÉ —
        # toute incertitude (API muette, run introuvable, parents inattendus)
        # rend `reuse=false` et le pipeline complet se déclenche.
        run: |
          python scripts/canonical_attestation.py \
            --sha "${{ github.sha }}" \
            --repo "${{ github.repository }}" \
            --github-output

      # ⛔ LA MOITIÉ SANS LAQUELLE LE RESTE EST FAUX.
      #
      # Une première version DÉDUISAIT l'arbre testé de `tree(M) == tree(H)`.
      # Contre-exemple mesuré : la base reçoit `X`, la CI teste `H + X`, la
      # base annule `X`, et le merge final retrouve `tree(H)` — l'ancienne
      # règle concluait `REUSE` alors que la CI n'avait jamais vu le contenu
      # devenu canonique. On ne déduit plus : on conserve ce qui a été testé.
      - name: Upload the PR attestation
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-attestation
          path: pr_attestation.json
          retention-days: 7
          # `error` : sans cet artefact, aucun push ne pourra jamais réutiliser
          # ce verdict. Mieux vaut le savoir tout de suite.
          if-no-files-found: error

  test-shard:
    name: pytest shard ${{ matrix.shard }}
    needs: [canonical-attestation]
    # `always()` est INDISPENSABLE, et pour deux raisons distinctes :
    #  · sur une PR, `canonical-attestation` est ignoré (`if: push`), et sans
    #    `always()` un job qui dépend d'un job ignoré est ignoré à son tour —
    #    la PR ne serait plus testée du tout ;
    #  · si l'attestation ÉCHOUE, ses outputs sont vides, donc `!= 'true'` est
    #    vrai et les shards tournent. Échec fermé par construction.
    if: always() && needs.canonical-attestation.outputs.skip_shards != 'true'
    strategy:
      fail-fast: false
      matrix:
        # Sb_OPS_CI_SCALE_02 — 2 → 3 shards. GitHub Actions ne peut pas appeler
        # Python pour construire une matrice, donc cette liste est la SEULE
        # copie du nombre de shards que le YAML doit porter en dur. Elle est
        # machine-vérifiée : `tests/test_ci_shard_topology.py` compare cette
        # matrice à `ci_test_shards.DEFAULT_SHARDS` et échoue si elles
        # divergent. Tout le reste du pipeline dérive le nombre.
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    # Sx_UI_07.1 CI headroom — full pytest+coverage can exceed 35 min on slow runners; gates unchanged.
    timeout-minutes: 45
    # Sb_20.4 — Le repo n'est pas installé en éditable. pytest trouve
    # `app/` via sa config, mais `python scripts/x.py` exécute le script
    # avec sys.path = [scripts/, ...] et perd la racine. PYTHONPATH=. le
    # remet en place pour tous les steps QA.
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sb_CI_02_1 — full history so the change-scope classifier can diff against the
          # PR base / previous push commit. Mirrors the lint and sonar jobs.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Sb_CI_02_1 — path-aware gating. Classify the change set ONCE, then gate the
      # expensive steps below. The job itself ALWAYS runs and always reports, so the
      # required check "pytest + QA scripts" can never stay Expected/Pending.
      # Fail-safe: any unknown path, an empty diff, or a failing diff command yields
      # RUNTIME_OR_INFRA and the full pipeline runs. Only `docs/**` and
      # `.claude/skills/**` can produce NON_RUNTIME (see scripts/classify_change_scope.py).
      - name: Classify change scope (Sb_CI_02_1)
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          changed=""
          if [ -n "${BASE_SHA:-}" ] \
             && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" || true)"
          fi
          # An empty list means "undetermined" to the classifier, which then returns
          # RUNTIME_OR_INFRA. Never skip the suite on ignorance.
          printf '%s\n' "${changed}" | python scripts/classify_change_scope.py --github-output

      - name: Install dependencies
        if: steps.scope.outputs.runtime == 'true'
        run: |
          python -m pip install --upgrade pip
          # Sb_DEPENDENCY_LOCK_AUTHORITY_01 — install the LOCK, not the source spec.
          # requirements.txt carries open ranges (fastapi>=0.110, …), so installing
          # it resolved the latest compatible versions at run time: two runs of the
          # same SHA could test different dependency trees. The lock is the install
          # contract; scripts/check_lock_drift.py keeps it honest against the spec.
          pip install -r requirements-lock.txt
          # Sb_20.1 — pytest-cov + coverage[toml] produce coverage.xml
          # for SonarCloud. httpx is required by the FastAPI TestClient.
          # Sb_OPS.ci-efficiency — pytest-xdist runs the suite in parallel
          # (`-n auto`); coverage is combined across workers by pytest-cov.
          pip install pytest pytest-cov pytest-xdist "coverage[toml]" httpx

      - name: Run pytest with coverage
        if: steps.scope.outputs.runtime == 'true'
        # test_v1_acceptance.py checks a local VSCode setup and is
        # intentionally excluded from CI. Coverage is collected over
        # `app/` (configured in pyproject.toml [tool.coverage.run]).
        # The XML report is consumed by SonarCloud (Sb_20.4).
        # Sb_OPS.ci-efficiency — `-n auto` fans the suite across the
        # runner's cores; `--dist worksteal` rebalances uneven test
        # durations. The suite is xdist-safe (per-test tempdir SQLite in
        # tests/conftest.py); pytest-cov merges per-worker coverage so
        # coverage.xml stays complete for the SonarCloud sensor.
        # Sb_OPS_CI_RUNNER_STABILITY_01 — the flags now live in
        # `scripts/run_ci_pytest.sh`, the single source of truth that an
        # operator runs verbatim. A guard test fails if this step stops
        # invoking it, so "CI-identical" can no longer drift.
        #
        # WS1 — a resource sampler streams `CI_RESOURCE` lines to STDOUT during
        # the run. Three runner shutdowns skipped every later step (artifact
        # upload included), so telemetry must be in the live log to survive.
        # WS2 — `/usr/bin/time -v` reports peak RSS. Both are diagnostics only:
        # pytest's exit code is captured and re-raised unchanged.
        # No `|| 'auto'` fallback here. A literal default in the workflow SETS
        # the variable, which defeats the script's own `:-` default — the first
        # mitigation attempt silently ran on 4 workers again and would have been
        # reported as a validated fix. The canonical default lives in the script
        # and nowhere else; an unset repository variable yields an empty string,
        # which `:-` correctly treats as absent.
        #
        # Sb_OPS_CI_SCALE_01 — this shard runs ONLY its slice of the test files.
        # The suite needs ~16.6 GB (measured ~4.4 MB/test over 3 861 tests) on a
        # 15.99 GB machine, and that total is invariant to the worker count, so
        # the only way under the ceiling without dropping a single test is fewer
        # tests PER MACHINE. Coverage is written to a per-shard data file and
        # combined downstream into ONE authoritative report.
        env:
          CI_PYTEST_WORKERS: ${{ vars.CI_PYTEST_WORKERS }}
          # NOT a dotfile: actions/upload-artifact@v4 silently skips hidden
          # files, so `.coverage.shard-N` uploaded nothing and the combine step
          # found no data. A visible name removes the whole class of problem.
          COVERAGE_FILE: coverage-shard-${{ matrix.shard }}.data
        run: |
          python scripts/ci_resource_sampler.py &
          SAMPLER_PID=$!
          trap 'kill "${SAMPLER_PID}" 2>/dev/null || true' EXIT

          SHARD_FILES="$(python scripts/ci_test_shards.py --shard ${{ matrix.shard }})"
          echo "[ci-pytest] shard ${{ matrix.shard }} file count: $(echo "${SHARD_FILES}" | wc -w)"

          set +e
          # shellcheck disable=SC2086 # deliberate word splitting: a file list
          /usr/bin/time -v bash scripts/run_ci_pytest.sh ${SHARD_FILES}
          PYTEST_RC=$?
          set -e

          kill "${SAMPLER_PID}" 2>/dev/null || true
          echo "[ci-pytest] pytest exit code: ${PYTEST_RC}"
          exit "${PYTEST_RC}"

      # Sb_OPS.sonar-coverage-fix — the former "Prefix coverage paths with app/"
      # step is REMOVED. `[tool.coverage.run] relative_files = true` (pyproject)
      # now writes coverage.xml paths RELATIVE to the repo root, which the
      # SonarCloud Cobertura sensor resolves against `sonar.sources=app`
      # directly. The old `sed` `app/`-prefix double-prefixed under the bumped
      # Java 21 scanner (source `.../app` + `app/config.py`) and broke ALL
      # coverage (0.0% / 6456 uncovered) — dropping it is the fix.

      - name: Verify the shard partition is exact
        if: steps.scope.outputs.runtime == 'true'
        # Refuses to run unless union(shards) == suite and the shards are
        # disjoint. A dropped file would keep every job green while quietly
        # reducing coverage — that is the failure this guard exists to prevent.
        run: python scripts/ci_test_shards.py --verify

      - name: Upload shard coverage data
        if: always() && steps.scope.outputs.runtime == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}.data
          retention-days: 7
          # `error`, not `warn`: a missing shard would silently yield PARTIAL
          # coverage that Sonar would then judge as if it were complete.
          if-no-files-found: error

  test:
    # Sb_OPS_CI_SCALE_01 — downstream aggregator. Keeps the required check name
    # "pytest + QA scripts" EXACTLY as branch protection expects: a bare matrix
    # would have renamed it to "... (1)" / "... (2)" and silently made every PR
    # unmergeable. The shards do the running; this job proves the result and
    # owns the single authoritative coverage report.
    #
    # It also hosts the QA / migration checks, which are cheap, must run once,
    # and would be wasteful (and confusing) duplicated per shard.
    name: pytest + QA scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-shard, canonical-attestation]
    # `always()` so a shard failure still produces this required check with a
    # verdict instead of leaving it Expected forever.
    #
    # Sx_CI_CANONICAL_DEDUP_01 — ce job garde son nom EXACT parce que la
    # protection de branche l'exige (`pytest + QA scripts`). Il tourne dans les
    # deux régimes et rend toujours un verdict : en réutilisation il n'exécute
    # simplement pas les shards, mais il continue de porter les QA, les
    # migrations, le perf smoke et la publication de la couverture.
    permissions:
      contents: read
      actions: read
    if: always()
    env:
      PYTHONPATH: .
      # Vide sur une PR ; `true` uniquement sur un push canonique attesté.
      REUSE: ${{ needs.canonical-attestation.outputs.skip_shards }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sb_CI_02_1 — full history so the change-scope classifier can diff against the
          # PR base / previous push commit. Mirrors the lint and sonar jobs.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Sb_CI_02_1 — path-aware gating. Classify the change set ONCE, then gate the
      # expensive steps below. The job itself ALWAYS runs and always reports, so the
      # required check "pytest + QA scripts" can never stay Expected/Pending.
      # Fail-safe: any unknown path, an empty diff, or a failing diff command yields
      # RUNTIME_OR_INFRA and the full pipeline runs. Only `docs/**` and
      # `.claude/skills/**` can produce NON_RUNTIME (see scripts/classify_change_scope.py).
      - name: Classify change scope (Sb_CI_02_1)
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          changed=""
          if [ -n "${BASE_SHA:-}" ] \
             && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" || true)"
          fi
          # An empty list means "undetermined" to the classifier, which then returns
          # RUNTIME_OR_INFRA. Never skip the suite on ignorance.
          printf '%s\n' "${changed}" | python scripts/classify_change_scope.py --github-output

      - name: Install dependencies
        if: steps.scope.outputs.runtime == 'true'
        run: |
          python -m pip install --upgrade pip
          # Sb_DEPENDENCY_LOCK_AUTHORITY_01 — install the LOCK, not the source spec.
          # requirements.txt carries open ranges (fastapi>=0.110, …), so installing
          # it resolved the latest compatible versions at run time: two runs of the
          # same SHA could test different dependency trees. The lock is the install
          # contract; scripts/check_lock_drift.py keeps it honest against the spec.
          pip install -r requirements-lock.txt
          # Sb_20.1 — pytest-cov + coverage[toml] produce coverage.xml
          # for SonarCloud. httpx is required by the FastAPI TestClient.
          # Sb_OPS.ci-efficiency — pytest-xdist runs the suite in parallel
          # (`-n auto`); coverage is combined across workers by pytest-cov.
          pip install pytest pytest-cov pytest-xdist "coverage[toml]" httpx

      - name: Fail if any shard failed
        # The aggregator must never report success over a red shard.
        #
        # Sx_CI_CANONICAL_DEDUP_01 — en réutilisation attestée les shards sont
        # `skipped`, ce qui n'est pas `success`. Sans la clause `REUSE`, cette
        # garde ferait échouer TOUS les pushs réutilisés. Elle reste entière
        # dans le régime normal : un shard rouge fait toujours tomber le job.
        if: >-
          env.REUSE != 'true'
          && needs.test-shard.result != 'success'
          && steps.scope.outputs.runtime == 'true'
        run: |
          echo "A pytest shard did not succeed: ${{ needs.test-shard.result }}"
          exit 1

      - name: Reused verdict — import the attested run's coverage
        # SonarCloud consomme `coverage.xml`. Sans cette étape, l'analyse DE
        # BRANCHE (distincte de l'analyse de PR) publierait une couverture
        # nulle et abîmerait le gate projet : on aurait échangé du temps de
        # calcul contre une dégradation de signal, exactement ce que la
        # mission interdit.
        #
        # L'artefact vient du run de PR ATTESTÉ — même contenu, donc même
        # couverture. L'entrée de Sonar est rigoureusement identique à celle
        # d'un run complet.
        if: env.REUSE == 'true' && steps.scope.outputs.runtime == 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          run-id: ${{ needs.canonical-attestation.outputs.attested_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Reused verdict — say plainly what was skipped and why
        if: env.REUSE == 'true'
        run: |
          echo "CANONICAL ATTESTATION — verdict réutilisé."
          echo "  ${{ needs.canonical-attestation.outputs.reason }}"
          echo ""
          echo "NON exécuté : les 3 shards pytest."
          echo "Exécuté à l'identique : lint, QA catalogue/atlas/EKB,"
          echo "  drift Alembic, snapshot de schéma, patterns et roundtrip de"
          echo "  migration, perf smoke, et l'analyse SonarCloud de branche"
          echo "  — alimentée par la couverture du run attesté."
          echo ""
          echo "L'arbre Git de ce commit est identique, à l'octet, à celui que"
          echo "la CI de PR a validé. Rejouer la suite ne pourrait pas changer"
          echo "le verdict."

      - name: Download shard coverage data
        if: env.REUSE != 'true' && steps.scope.outputs.runtime == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine shard coverage into ONE authoritative report
        if: env.REUSE != 'true' && steps.scope.outputs.runtime == 'true'
        # coverage.py's native parallel mode: each shard wrote `.coverage.shard-N`
        # with `relative_files = true` (pyproject), so paths resolve identically
        # across machines and combine cleanly. Sonar consumes this single file —
        # no shard-local report is ever published, and coverage is not weakened.
        run: |
          find . -maxdepth 1 -name 'coverage-shard-*.data' -exec ls -la {} +
          # Fail loudly if a shard's data never arrived, rather than combining
          # whatever is present and publishing an understated coverage figure.
          #
          # Sb_OPS_CI_SCALE_02 — le nombre attendu est DÉRIVÉ de la source
          # unique versionnée, plus écrit en dur ici. C'était la troisième
          # copie du chiffre : elle pouvait rester à 2 pendant que la matrice
          # passait à 3, et la CI serait restée verte en publiant la couverture
          # de deux shards sur trois.
          expected=$(python scripts/ci_test_shards.py --shard-count)
          found=$(find . -maxdepth 1 -name 'coverage-shard-*.data' | wc -l)
          echo "[coverage] expected ${expected} shard data files, found ${found}"
          if [ "${found}" -ne "${expected}" ]; then
            echo "expected ${expected} shard coverage files, found ${found}"
            exit 1
          fi
          python -m coverage combine coverage-shard-*.data
          python -m coverage xml -o coverage.xml
          python -m coverage report --skip-empty | tail -5

      - name: Upload coverage artifact
        if: always() && steps.scope.outputs.runtime == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Catalog QA
        if: steps.scope.outputs.runtime == 'true'
        run: python scripts/catalog_qa.py

      - name: Machine atlas QA
        if: steps.scope.outputs.runtime == 'true'
        run: python scripts/machine_atlas_qa.py

      - name: EKB classifiability QA (Sb_CUSTOM_PROGRAM_EKB_03)
        if: steps.scope.outputs.runtime == 'true'
        run: python -m scripts.ekb_classifiability_qa

      - name: Alembic drift check
        if: steps.scope.outputs.runtime == 'true'
        run: python scripts/check_alembic_drift.py

      # Sb_26.2 — Schema snapshot must match alembic head. If it diverges,
      # the operator must run `python scripts/generate_schema_snapshot.py`
      # and commit data/schema_snapshot.sql.
      - name: Schema snapshot check (Sb_26.2)
        if: steps.scope.outputs.runtime == 'true'
        run: python scripts/check_schema_snapshot.py

      # Sb_26.2 — Static linter for dangerous migration patterns
      # (drop_column/table, NOT NULL without server_default, raw
      # DELETE/UPDATE). Grandfathered list in .migration-policy.json.
      - name: Migration patterns check (Sb_26.2)
        if: steps.scope.outputs.runtime == 'true'
        run: python scripts/check_migration_patterns.py

      # Sb_26.2 — Rollback dry-run: alembic downgrade -1 + upgrade head
      # on a fresh SQLite. Mirrors the prod rollback model.
      - name: Migration roundtrip check (Sb_26.2)
        if: steps.scope.outputs.runtime == 'true'
        run: python scripts/check_migration_roundtrip.py

      # Sb_26.6 — perf baseline smoke + budget. Lives in the `test` job
      # because it needs the full runtime deps (FastAPI, SQLAlchemy)
      # which the `lint` job does not install. Smoke 5 iter × 10 routes
      # ≈ 5s. Budgets very wide (cf. .performance-budget.json) to detect
      # gross regressions only, not jitter.
      - name: Perf baseline smoke + budget (Sb_26.6)
        if: steps.scope.outputs.runtime == 'true'
        run: python scripts/perf_baseline.py --smoke --check-budget --no-write --environment ci

      # Sb_CI_02_1 — the NON_RUNTIME branch. The job still runs, still reports success, and
      # states plainly what was skipped and why, so a reviewer never has to guess whether the
      # suite ran. The `lint` job (ruff budget, bandit, actionlint, shellcheck, pip-audit,
      # gitleaks, spec protocol, auth-scope matrix) is deliberately NOT gated and still runs
      # in full on every change, which is what keeps documentation and skill changes covered.
      # ═══ Sx_CI_TEST_ISOLATION_01 — un test modifié doit passer SEUL ═══
      #
      # Le 2026-09-03 la canonique est tombée sur un test que personne n'avait
      # touché : il ne passait que grâce à ses voisins de shard. Deux propriétés
      # rendaient le défaut invisible — l'ordre est déterministe
      # (`pytest-randomly` absent), mais la LISTE de fichiers bouge : le
      # shardage est un tourniquet par index, et ajouter un seul fichier de test
      # déplace 229 fichiers sur 292.
      #
      # Quelques secondes par fichier changé, sur le seul diff qui peut
      # introduire la classe.
      - name: Changed test files must pass alone (Sx_CI_TEST_ISOLATION_01)
        if: steps.scope.outputs.runtime == 'true' && github.event_name == 'pull_request'
        run: |
          python scripts/check_test_isolation.py \
            --base "origin/${{ github.base_ref }}" \
            --head "HEAD"

      - name: Non-runtime change — full suite intentionally skipped (Sb_CI_02_1)
        if: steps.scope.outputs.runtime != 'true'
        run: |
          echo "Change scope: ${{ steps.scope.outputs.scope }}"
          echo "Every changed path is documentation (docs/**) or agent tooling (.claude/skills/**)."
          echo "Skipped: pytest + coverage + 8 QA scripts (they cannot be affected)."
          echo "Still enforced on this PR: the entire lint job — ruff budget, bandit,"
          echo "actionlint, shellcheck, pip-audit, gitleaks, spec protocol, auth scope matrix"
          echo "— plus Gitar review and the SonarCloud quality gate."


  lint:
    # Sb_26.1 — ruff + bandit + actionlint + shellcheck.
    # Anciennement advisory (Sb_20.2). Maintenant en mode "budget locked"
    # via `.ruff-budget.json` : la CI échoue si total > baseline. Voir
    # docs/CI_QUALITY_BUDGET.md pour la méthodologie complète.
    name: lint (ruff budget + bandit + actionlint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sb_CI_01 — full history required for gitleaks-action in
          # pull_request context. The action diff-scans the PR commit
          # range (HEAD^..HEAD); a shallow clone lacks the parent commit,
          # so the internal git-range command fails ("no leaks found in
          # partial scan" + non-zero exit) — a tooling false failure, not
          # a secret. Mirrors the sonar job, which already uses depth 0.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit pip-tools

      # Sb_26.1 — ruff format reste advisory en CI le temps que le
      # cleanup soit fait (la baseline cible `ruff check` warnings, pas
      # le formatter). Garde la visibilité mais ne bloque pas.
      - name: ruff format check (advisory)
        continue-on-error: true
        run: ruff format --check .

      # Sb_26.1 — ruff CHECK passe en REQUIRED via le budget script.
      # Le script échoue si total > baseline_warnings (548 actuellement)
      # OU si un fichier modifié ajoute des warnings (extension future).
      - name: ruff budget check (required — Sb_26.1)
        run: python scripts/check_ruff_budget.py

      # Sb_26.1 — bandit -ll devient REQUIRED. Le projet a 0 Med / 0 High
      # depuis Sb_20.2 ; on verrouille cet état.
      - name: bandit security scan (required — Sb_26.1)
        run: bandit -r app/ -ll -f screen

      # Sb_26.1 — actionlint vérifie la syntaxe des workflows GitHub
      # Actions. Required pour empêcher un workflow cassé d'arriver
      # en main.
      - name: actionlint (required — Sb_26.1)
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          level: error

      # Sb_26.1 — shellcheck vérifie nos scripts shell (deploy_prod.sh,
      # smoke_deploy.sh, deploy_from_github_actions.sh, etc.).
      # `-S warning` ne bloque que les niveaux warning/error, pas les info.
      #
      # Sb_OPS_CI_LINT_TIMEOUT_01 — `sudo apt-get update` + `install shellcheck`
      # ONT ÉTÉ RETIRÉS ICI, et c'est la correction entière de la tranche.
      #
      # Ce step a annulé le job quatre fois. Le diagnostic « cache froid » était
      # FAUX : sur l'annulation mesurée (run 32226738467), les neuf premiers
      # steps prennent 22 s au total, dont 6 s d'installation des linters —
      # exactement la normale. C'est `shellcheck` SEUL qui a tourné 290 s sans
      # jamais finir, parce que `apt-get update` interroge un miroir Ubuntu au
      # moment du job. Un miroir lent bloque, et le job meurt au plafond.
      #
      # Le remède n'était donc PAS un budget plus grand : augmenter
      # `timeout-minutes` aurait seulement fait durer le blocage plus longtemps.
      # Sur 39 exécutions réussies, la distribution est min 36 s · médiane 51 s ·
      # p90 77 s · max 109 s — le budget de 5 min n'a jamais été en cause.
      #
      # `shellcheck` est PRÉINSTALLÉ sur l'image du runner (`shellcheck 0.9.0-1`,
      # section « Installed apt packages » de `Ubuntu2404-Readme.md`). Les deux
      # lignes retirées étaient donc inutiles ET la seule dépendance réseau du
      # job. Aucun gate n'est affaibli : la même commande s'exécute sur les
      # mêmes fichiers.
      #
      # Si une image future cessait de le fournir, le step échoue bruyamment sur
      # `command not found` — un échec nommé, pas une annulation muette.
      - name: shellcheck (required — Sb_26.1)
        # Garde de ceinture : ce step prend ~1 s. S'il dépasse la minute, c'est
        # qu'il pend à nouveau, et l'échec doit NOMMER le step au lieu de
        # consommer le budget du job et d'emporter les six steps suivants.
        timeout-minutes: 1
        run: |
          shellcheck --version
          shellcheck -S warning $(find scripts -maxdepth 2 -name "*.sh" -not -path "*/\.*")

      # Sb_26.4 — pip-audit scans runtime deps for known CVEs.
      # Required: the project baseline is clean as of Sb_26.4 (cf.
      # docs/SECURITY_BASELINE.md §3). Any new vulnerability must be
      # addressed via upgrade or explicit ignore with justification.
      # Sb_DEPENDENCY_LOCK_AUTHORITY_01 — audit the LOCK. Auditing the source
      # spec meant auditing whatever pip-audit resolved from open ranges, which
      # was not necessarily what CI and prod installed. The lock IS what runs.
      - name: pip-audit runtime dependencies (required — Sb_26.4)
        run: pip-audit -r requirements-lock.txt --strict

      # Sb_26.4 — gitleaks scans the current tree for committed secrets.
      # Required on PR / push. Full-history scan is documented as a
      # one-shot manual op (cf. docs/SECURITY_BASELINE.md §6).
      - name: gitleaks scan (required — Sb_26.4)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

      # Sb_26.5 — spec-driven protocol checker. Verifies that every new
      # sprint report has a verdict marker, every new Sx_* spec has a
      # non-goals section, and the 6 templates + SPEC_REGISTRY.md exist.
      # No NLP — purely literal string presence. Historical files are
      # in .spec-protocol-allowlist.json (grandfathered).
      - name: spec protocol check (required — Sb_26.5)
        run: python scripts/check_spec_protocol.py

      # Sb_26.7 — verify the auth scope matrix + multi-tenant readiness
      # docs + Sb_26.7 sprint report exist. Pure presence-check, no NLP.
      - name: auth scope matrix presence (required — Sb_26.7)
        run: python scripts/check_auth_scope_matrix.py

      # Sb_DEPENDENCY_LOCK_AUTHORITY_01 — the lock is now what CI and the VPS
      # install, so this step is BLOCKING (it was advisory while nothing read the
      # file). It compares the pins against the specs in requirements.txt offline:
      # a dependency added to the source without regenerating the lock would
      # otherwise produce a green CI that never installed it.
      # The cross-Python brittleness that justified "advisory" is gone: the lock
      # is now resolved FOR 3.11 explicitly (scripts/regen_lockfile.sh).
      - name: requirements.txt ↔ requirements-lock.txt drift (blocking)
        run: python scripts/check_lock_drift.py

      # Sb_20.4 — JSON reports consumed by the SonarCloud job. Stays
      # advisory: never fail this step, always upload for Sonar.
      - name: ruff JSON report (for SonarCloud)
        if: always()
        continue-on-error: true
        run: ruff check . --output-format=json --output-file=ruff-report.json || true

      - name: bandit JSON report (for SonarCloud)
        if: always()
        continue-on-error: true
        run: bandit -r app/ -f json -o bandit-report.json || true

      - name: Upload linter reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linter-reports
          path: |
            ruff-report.json
            bandit-report.json
          retention-days: 7
          if-no-files-found: warn

  sonar:
    # Sb_20.4 — SonarCloud scan. Consumes coverage.xml from the `test`
    # job and ruff-report.json + bandit-report.json from the `lint` job
    # so the analysis stays consistent with what CI already ran.
    # ADVISORY in V1: continue-on-error keeps the merge unblocked.
    # Sb_20.5 will turn this into a required status check.
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, lint]
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar needs full history for blame / new-code detection.
          fetch-depth: 0

      - name: Download coverage report
        # Sb_CI_02_1 — tolerate absence. A NON_RUNTIME change produces no coverage.xml
        # because pytest did not run. The scanner must still execute so the EXTERNAL
        # required check "SonarCloud Code Analysis" is emitted. This is safe: with no new
        # lines of code, the quality gate does not evaluate `new_coverage` at all
        # (verified on PR #69 and #70, whose gates reported four conditions and no
        # coverage condition). Behaviour on runtime changes is unchanged.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: .

      - name: Download linter reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linter-reports
          path: .

      - name: SonarQube scan
        # Sb_20.5 — gate required (Quality Gate). If this step fails, the
        # merge is blocked.
        # Sb_OPS.sonar-java21 (2026-07-07) — bump legacy
        # `sonarcloud-github-action@v2` (bundled scanner ran on Java 17,
        # now rejected by SonarQube Cloud) to the current
        # `sonarqube-scan-action@v7.1.0` which ships a Java 21 scanner.
        # No setup-java needed: the v7 action bundles its own runtime.
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
