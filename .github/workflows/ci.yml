name: CI

on:
  pull_request:
  push:
    # Sb_20.4 — branche par défaut du repo (pas de `main` distant ; cette
    # branche fait office de trunk). À ajuster si on renomme un jour.
    branches: [main, claude/sprint-reporting-fitness-app-V7Qr6]
    # Sb_OPS.ci-path-filter — skip CI on docs-only pushes. Un push dont
    # TOUS les fichiers sont sous docs/ ne déclenche pas ce workflow ; il
    # suffit qu'un seul fichier hors docs/ change pour que la CI joue.
    # Trigger `pull_request` NON affecté : toute PR déclenche CI complète.
    paths-ignore:
      - 'docs/**'

# Read-only: this workflow never touches prod, never pushes tags,
# never deploys. Deployment lives in deploy-production.yml.
permissions:
  contents: read

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + QA scripts
    runs-on: ubuntu-latest
    # Sx_UI_07.1 CI headroom — full pytest+coverage can exceed 35 min on slow runners; gates unchanged.
    timeout-minutes: 45
    # Sb_20.4 — Le repo n'est pas installé en éditable. pytest trouve
    # `app/` via sa config, mais `python scripts/x.py` exécute le script
    # avec sys.path = [scripts/, ...] et perd la racine. PYTHONPATH=. le
    # remet en place pour tous les steps QA.
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Sb_20.1 — pytest-cov + coverage[toml] produce coverage.xml
          # for SonarCloud. httpx is required by the FastAPI TestClient.
          # Sb_OPS.ci-efficiency — pytest-xdist runs the suite in parallel
          # (`-n auto`); coverage is combined across workers by pytest-cov.
          pip install pytest pytest-cov pytest-xdist "coverage[toml]" httpx

      - name: Run pytest with coverage
        # test_v1_acceptance.py checks a local VSCode setup and is
        # intentionally excluded from CI. Coverage is collected over
        # `app/` (configured in pyproject.toml [tool.coverage.run]).
        # The XML report is consumed by SonarCloud (Sb_20.4).
        # Sb_OPS.ci-efficiency — `-n auto` fans the suite across the
        # runner's cores; `--dist worksteal` rebalances uneven test
        # durations. The suite is xdist-safe (per-test tempdir SQLite in
        # tests/conftest.py); pytest-cov merges per-worker coverage so
        # coverage.xml stays complete for the SonarCloud sensor.
        run: |
          pytest \
            -n auto \
            --dist worksteal \
            --ignore=tests/test_v1_acceptance.py \
            --cov=app \
            --cov-report=xml \
            --cov-report=term \
            -q

      # Sb_OPS.sonar-coverage-fix — the former "Prefix coverage paths with app/"
      # step is REMOVED. `[tool.coverage.run] relative_files = true` (pyproject)
      # now writes coverage.xml paths RELATIVE to the repo root, which the
      # SonarCloud Cobertura sensor resolves against `sonar.sources=app`
      # directly. The old `sed` `app/`-prefix double-prefixed under the bumped
      # Java 21 scanner (source `.../app` + `app/config.py`) and broke ALL
      # coverage (0.0% / 6456 uncovered) — dropping it is the fix.

      - name: Upload coverage artifact
        # Kept even if pytest failed so the SonarCloud step (Sb_20.4)
        # can still publish the partial report. Retention 7 days is
        # sufficient for debug.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Catalog QA
        run: python scripts/catalog_qa.py

      - name: Machine atlas QA
        run: python scripts/machine_atlas_qa.py

      - name: EKB classifiability QA (Sb_CUSTOM_PROGRAM_EKB_03)
        run: python -m scripts.ekb_classifiability_qa

      - name: Alembic drift check
        run: python scripts/check_alembic_drift.py

      # Sb_26.2 — Schema snapshot must match alembic head. If it diverges,
      # the operator must run `python scripts/generate_schema_snapshot.py`
      # and commit data/schema_snapshot.sql.
      - name: Schema snapshot check (Sb_26.2)
        run: python scripts/check_schema_snapshot.py

      # Sb_26.2 — Static linter for dangerous migration patterns
      # (drop_column/table, NOT NULL without server_default, raw
      # DELETE/UPDATE). Grandfathered list in .migration-policy.json.
      - name: Migration patterns check (Sb_26.2)
        run: python scripts/check_migration_patterns.py

      # Sb_26.2 — Rollback dry-run: alembic downgrade -1 + upgrade head
      # on a fresh SQLite. Mirrors the prod rollback model.
      - name: Migration roundtrip check (Sb_26.2)
        run: python scripts/check_migration_roundtrip.py

      # Sb_26.6 — perf baseline smoke + budget. Lives in the `test` job
      # because it needs the full runtime deps (FastAPI, SQLAlchemy)
      # which the `lint` job does not install. Smoke 5 iter × 10 routes
      # ≈ 5s. Budgets very wide (cf. .performance-budget.json) to detect
      # gross regressions only, not jitter.
      - name: Perf baseline smoke + budget (Sb_26.6)
        run: python scripts/perf_baseline.py --smoke --check-budget --no-write --environment ci

  lint:
    # Sb_26.1 — ruff + bandit + actionlint + shellcheck.
    # Anciennement advisory (Sb_20.2). Maintenant en mode "budget locked"
    # via `.ruff-budget.json` : la CI échoue si total > baseline. Voir
    # docs/CI_QUALITY_BUDGET.md pour la méthodologie complète.
    name: lint (ruff budget + bandit + actionlint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sb_CI_01 — full history required for gitleaks-action in
          # pull_request context. The action diff-scans the PR commit
          # range (HEAD^..HEAD); a shallow clone lacks the parent commit,
          # so the internal git-range command fails ("no leaks found in
          # partial scan" + non-zero exit) — a tooling false failure, not
          # a secret. Mirrors the sonar job, which already uses depth 0.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit pip-tools

      # Sb_26.1 — ruff format reste advisory en CI le temps que le
      # cleanup soit fait (la baseline cible `ruff check` warnings, pas
      # le formatter). Garde la visibilité mais ne bloque pas.
      - name: ruff format check (advisory)
        continue-on-error: true
        run: ruff format --check .

      # Sb_26.1 — ruff CHECK passe en REQUIRED via le budget script.
      # Le script échoue si total > baseline_warnings (548 actuellement)
      # OU si un fichier modifié ajoute des warnings (extension future).
      - name: ruff budget check (required — Sb_26.1)
        run: python scripts/check_ruff_budget.py

      # Sb_26.1 — bandit -ll devient REQUIRED. Le projet a 0 Med / 0 High
      # depuis Sb_20.2 ; on verrouille cet état.
      - name: bandit security scan (required — Sb_26.1)
        run: bandit -r app/ -ll -f screen

      # Sb_26.1 — actionlint vérifie la syntaxe des workflows GitHub
      # Actions. Required pour empêcher un workflow cassé d'arriver
      # en main.
      - name: actionlint (required — Sb_26.1)
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          level: error

      # Sb_26.1 — shellcheck vérifie nos scripts shell (deploy_prod.sh,
      # smoke_deploy.sh, deploy_from_github_actions.sh, etc.).
      # `-S warning` ne bloque que les niveaux warning/error, pas les info.
      - name: shellcheck (required — Sb_26.1)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning $(find scripts -maxdepth 2 -name "*.sh" -not -path "*/\.*")

      # Sb_26.4 — pip-audit scans runtime deps for known CVEs.
      # Required: the project baseline is clean as of Sb_26.4 (cf.
      # docs/SECURITY_BASELINE.md §3). Any new vulnerability must be
      # addressed via upgrade or explicit ignore with justification.
      - name: pip-audit runtime dependencies (required — Sb_26.4)
        run: pip-audit -r requirements.txt --strict

      # Sb_26.4 — gitleaks scans the current tree for committed secrets.
      # Required on PR / push. Full-history scan is documented as a
      # one-shot manual op (cf. docs/SECURITY_BASELINE.md §6).
      - name: gitleaks scan (required — Sb_26.4)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

      # Sb_26.5 — spec-driven protocol checker. Verifies that every new
      # sprint report has a verdict marker, every new Sx_* spec has a
      # non-goals section, and the 6 templates + SPEC_REGISTRY.md exist.
      # No NLP — purely literal string presence. Historical files are
      # in .spec-protocol-allowlist.json (grandfathered).
      - name: spec protocol check (required — Sb_26.5)
        run: python scripts/check_spec_protocol.py

      # Sb_26.7 — verify the auth scope matrix + multi-tenant readiness
      # docs + Sb_26.7 sprint report exist. Pure presence-check, no NLP.
      - name: auth scope matrix presence (required — Sb_26.7)
        run: python scripts/check_auth_scope_matrix.py

      # Sb_26.4 — verify requirements-lock.txt is committed and parses.
      # ADVISORY for V1: a strict diff vs a fresh `pip-compile` is brittle
      # across Python versions (CI is 3.11, dev may differ). We just
      # ensure the file exists and is a syntactically valid requirements
      # file. Strict cross-Python freshness is in Sb_26.next backlog.
      # See docs/SECURITY_BASELINE.md §5.
      - name: requirements-lock.txt presence + parse (advisory — Sb_26.4)
        continue-on-error: true
        run: |
          test -f requirements-lock.txt
          # `pip install --dry-run` parses the file and resolves the
          # graph without installing — fast and version-tolerant.
          pip install --dry-run -r requirements-lock.txt > /dev/null

      # Sb_20.4 — JSON reports consumed by the SonarCloud job. Stays
      # advisory: never fail this step, always upload for Sonar.
      - name: ruff JSON report (for SonarCloud)
        if: always()
        continue-on-error: true
        run: ruff check . --output-format=json --output-file=ruff-report.json || true

      - name: bandit JSON report (for SonarCloud)
        if: always()
        continue-on-error: true
        run: bandit -r app/ -f json -o bandit-report.json || true

      - name: Upload linter reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linter-reports
          path: |
            ruff-report.json
            bandit-report.json
          retention-days: 7
          if-no-files-found: warn

  sonar:
    # Sb_20.4 — SonarCloud scan. Consumes coverage.xml from the `test`
    # job and ruff-report.json + bandit-report.json from the `lint` job
    # so the analysis stays consistent with what CI already ran.
    # ADVISORY in V1: continue-on-error keeps the merge unblocked.
    # Sb_20.5 will turn this into a required status check.
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, lint]
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar needs full history for blame / new-code detection.
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: .

      - name: Download linter reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linter-reports
          path: .

      - name: SonarQube scan
        # Sb_20.5 — gate required (Quality Gate). If this step fails, the
        # merge is blocked.
        # Sb_OPS.sonar-java21 (2026-07-07) — bump legacy
        # `sonarcloud-github-action@v2` (bundled scanner ran on Java 17,
        # now rejected by SonarQube Cloud) to the current
        # `sonarqube-scan-action@v7.1.0` which ships a Java 21 scanner.
        # No setup-java needed: the v7 action bundles its own runtime.
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
