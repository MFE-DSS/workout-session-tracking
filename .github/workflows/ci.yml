name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: this workflow never touches prod, never pushes tags,
# never deploys. Deployment lives in deploy-production.yml.
permissions:
  contents: read

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + QA scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run pytest
        # test_v1_acceptance.py checks a local VSCode setup and is
        # intentionally excluded from CI. test_deploy_artifacts.py was
        # excluded historically because .env.production.example was
        # missing — Sb_16 adds that file so the suite now runs it.
        run: |
          pytest --ignore=tests/test_v1_acceptance.py -q

      - name: Catalog QA
        run: python scripts/catalog_qa.py

      - name: Machine atlas QA
        run: python scripts/machine_atlas_qa.py

      - name: Alembic drift check
        run: python scripts/check_alembic_drift.py
