name: CI

on:
  pull_request:
  push:
    # Sb_20.4 — branche par défaut du repo (pas de `main` distant ; cette
    # branche fait office de trunk). À ajuster si on renomme un jour.
    branches: [main, claude/sprint-reporting-fitness-app-V7Qr6]

# Read-only: this workflow never touches prod, never pushes tags,
# never deploys. Deployment lives in deploy-production.yml.
permissions:
  contents: read

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + QA scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Sb_20.1 — pytest-cov + coverage[toml] produce coverage.xml
          # for SonarCloud. httpx is required by the FastAPI TestClient.
          pip install pytest pytest-cov "coverage[toml]" httpx

      - name: Run pytest with coverage
        # test_v1_acceptance.py checks a local VSCode setup and is
        # intentionally excluded from CI. Coverage is collected over
        # `app/` (configured in pyproject.toml [tool.coverage.run]).
        # The XML report is consumed by SonarCloud (Sb_20.4).
        run: |
          pytest \
            --ignore=tests/test_v1_acceptance.py \
            --cov=app \
            --cov-report=xml \
            --cov-report=term \
            -q

      - name: Upload coverage artifact
        # Kept even if pytest failed so the SonarCloud step (Sb_20.4)
        # can still publish the partial report. Retention 7 days is
        # sufficient for debug.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Catalog QA
        run: python scripts/catalog_qa.py

      - name: Machine atlas QA
        run: python scripts/machine_atlas_qa.py

      - name: Alembic drift check
        run: python scripts/check_alembic_drift.py

  lint:
    # Sb_20.2 — ruff + bandit. ADVISORY in V1: each step has
    # `continue-on-error: true` so warnings surface in the GitHub UI
    # (orange step) without blocking the merge. Sb_20.5 will turn this
    # into a hard gate via the SonarCloud Quality Gate as required
    # status check.
    name: ruff + bandit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: ruff check
        continue-on-error: true
        # --output-format=github so warnings show up as PR annotations
        run: ruff check . --output-format=github

      - name: ruff format check
        continue-on-error: true
        run: ruff format --check .

      - name: bandit security scan
        continue-on-error: true
        # -ll = report medium and high severity only (skip low noise V1)
        run: bandit -r app/ -ll -f screen

      # Sb_20.4 — JSON reports consumed by the SonarCloud job. Both stay
      # advisory: never fail the job, always upload, even on warnings.
      - name: ruff JSON report (for SonarCloud)
        if: always()
        continue-on-error: true
        run: ruff check . --output-format=json --output-file=ruff-report.json || true

      - name: bandit JSON report (for SonarCloud)
        if: always()
        continue-on-error: true
        run: bandit -r app/ -f json -o bandit-report.json || true

      - name: Upload linter reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linter-reports
          path: |
            ruff-report.json
            bandit-report.json
          retention-days: 7
          if-no-files-found: warn

  sonar:
    # Sb_20.4 — SonarCloud scan. Consumes coverage.xml from the `test`
    # job and ruff-report.json + bandit-report.json from the `lint` job
    # so the analysis stays consistent with what CI already ran.
    # ADVISORY in V1: continue-on-error keeps the merge unblocked.
    # Sb_20.5 will turn this into a required status check.
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, lint]
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar needs full history for blame / new-code detection.
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: .

      - name: Download linter reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linter-reports
          path: .

      - name: SonarCloud scan
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
