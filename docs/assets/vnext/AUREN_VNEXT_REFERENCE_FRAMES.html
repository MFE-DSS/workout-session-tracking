<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUREN vNext — cadres de référence</title>
<!--
  Sx_AUREN_MOBILE_EXPERIENCE_VNEXT §11.4 — VNEXT_INTERACTION_REFERENCE_FRAME (r2).

  STATUT : VNEXT_INTERACTION_REFERENCE_FRAME — ACCEPTÉ par l'opérateur le
  2026-10-23 (D8) comme référence d'INTERACTION, pas de forme native. Ces cadres
  ne deviennent pas une baseline. Aucun code de production ne les importe.

  Ils GOUVERNENT : hiérarchie d'information, état, action souveraine, géométrie
  de base, zéro tableau de bord en séance.
  Ils NE FIGENT PAS : typographie, mise en page exacte, forme des composants,
  plaques, iconographie, palette, mouvement, chrome de navigation, haptique,
  feuilles natives, saisie numérique. Le labo natif N0 peut faire mieux.

  Données : uniquement ce que le produit calcule déjà, relevé le 2026-10-23
  sur une base de labo semée (gabarit `push-a` du catalogue réel, phrases au
  format exact de `recommendation_v3.expliquer` / `phrase_de`, libellés exacts
  de `overload_explainer`). Aucune durée estimée (AUREN_INSTRUMENTS §6.2bis-3).

  Contrastes mesurés (WCAG 2.x, couple avant-plan / fond réel) — voir la spec §11.3.
  Rendus PNG : NON versionnés (garde test_auren_muscle_focus_source_policy) ;
  capturer chaque `.device` à 390×844 au moment de l'exposition.
-->
<style>
:root {
  --field-work: #0B0C0E;   /* fond EXECUTION/MISSION */
  --field-rest: #06141C;   /* fond REST — 1,05:1 vs work : JAMAIS porteur seul de l'état */
  --plate: #1B1E23;        /* 1,17:1 sur field-work (plancher 1,12) */
  --plate-rest: #10293A;   /* 1,25:1 sur field-rest */
  --line: #2A2E35;         /* 1,44:1, non-texte */
  --ink: #F4F1EA;          /* 17,35:1 field-work · 14,82:1 plate · 13,29:1 plate-rest */
  --ink-2: #B4B8BF;        /* 9,83:1 field-work · 8,40:1 plate · 7,53:1 plate-rest */
  --ink-3: #8A9099;        /* 6,08:1 field-work · 5,20:1 plate · 4,66:1 plate-rest */
  --signal: #FFB238;       /* « à toi de jouer » — 10,88:1 field-work */
  --on-signal: #0B0C0E;    /* 10,88:1 sur signal */
  --system: #7CCBF5;       /* ce qu'AUREN produit / le temps — 10,92:1 field-work · 8,37:1 plate-rest */
  --gutter: 16px;
  --cmd-h: 68px;
  --pad: 56px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #2B2F36;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 32px;
}
.board { display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-start; }
.caption { width: 390px; margin-top: 10px; font-size: 13px; color: #C9CDD3; line-height: 1.4; }
.caption b { color: #fff; }

/* ── le cadre : 390 × 844, rien ne déborde ─────────────────────────────── */
.device {
  width: 390px; height: 844px; overflow: hidden; position: relative;
  background: var(--field-work); border-radius: 44px;
  display: flex; flex-direction: column;
  padding: 54px var(--gutter) 34px;
}
.device.rest { background: var(--field-rest); }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.meta { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.statusbar { position: absolute; top: 16px; left: 32px; right: 32px; display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; color: var(--ink); }

/* rail de position : un segment par exercice — forme ET couleur */
.rail { display: flex; gap: 4px; margin-bottom: 18px; }
.rail i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.rail i.done { background: var(--ink-2); }
.rail i.now { background: var(--signal); height: 6px; margin-top: -1px; }
.rest .rail i.now { background: var(--system); }
.topline { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--ink-2); font-size: 22px; border: 1px solid var(--line); background: transparent; }

/* commande souveraine : zone du pouce, une seule par état */
.cmd { margin-top: auto; }
.cmd button {
  width: 100%; height: var(--cmd-h); border-radius: 18px; border: 0;
  background: var(--signal); color: var(--on-signal);
  font: inherit; font-size: 19px; font-weight: 800; letter-spacing: .06em;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.cmd button small { font-size: 13px; font-weight: 600; letter-spacing: 0; opacity: .8; }
.cmd button.trait { background: transparent; color: var(--system); border: 2px solid var(--system); }
.secondary { display: flex; gap: 8px; margin-bottom: 12px; }
.secondary button {
  flex: 1; min-height: 48px; border-radius: 14px; background: transparent; color: var(--ink);
  border: 1px solid var(--line); font: inherit; font-size: 15px; font-weight: 600;
}
.rest .secondary button { border-color: #24465C; }

/* ── 1 MISSION ─────────────────────────────────────────────────────────── */
.m-date { color: var(--ink-2); font-size: 15px; margin: 14px 0 28px; }
.m-title { font-size: 52px; line-height: 1; font-weight: 800; letter-spacing: -.02em; }
.m-sub { font-size: 18px; color: var(--ink-2); margin-top: 8px; }
.why { margin-top: 28px; padding-left: 14px; border-left: 3px solid var(--system); }
.why p { font-size: 19px; line-height: 1.35; }
.why p + p { color: var(--ink-2); font-size: 16px; margin-top: 6px; }
.why .meta { margin-top: 10px; color: var(--system); letter-spacing: .08em; }
.scope { display: flex; gap: 24px; margin-top: 32px; }
.scope div { font-size: 34px; font-weight: 700; }
.scope span { display: block; font-size: 13px; color: var(--ink-3); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.first { margin-top: 28px; background: var(--plate); border-radius: 16px; padding: 14px 16px; border: 1px solid var(--line); }
.first .meta { margin-bottom: 6px; }
.first p { font-size: 17px; }
.first p span { color: var(--ink-2); }
.disclose { display: flex; justify-content: space-between; align-items: center; min-height: 48px; color: var(--ink-2); font-size: 15px; border-top: 1px solid var(--line); margin-top: 18px; }

/* ── 2 EXECUTION ───────────────────────────────────────────────────────── */
.x-name { font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; margin-top: 6px; }
.x-set { font-size: 16px; color: var(--ink-2); margin-top: 6px; }
.x-set b { color: var(--ink); }
.sets { display: flex; gap: 8px; margin-top: 16px; }
.sets div { flex: 1; border-radius: 12px; border: 1px solid var(--line); padding: 8px 10px; min-height: 52px; }
.sets div .meta { font-size: 11px; }
.sets div p { font-size: 15px; margin-top: 2px; color: var(--ink-2); }
.sets .done p::before { content: "✓ "; color: var(--ink); }
.sets .now { border: 2px solid var(--signal); background: var(--plate); }
.sets .now p { color: var(--ink); font-weight: 700; }
.sets .now p::before { content: "● "; color: var(--signal); }
.sets .next p::before { content: "○ "; }
.guide { margin-top: 18px; padding-left: 12px; border-left: 3px solid var(--system); }
.guide p { font-size: 16px; color: var(--system); font-weight: 600; }
.guide p + p { color: var(--ink-2); font-weight: 400; font-size: 15px; margin-top: 3px; }
.prev { margin-top: 12px; font-size: 15px; color: var(--ink-2); }
.prev b { color: var(--ink); font-weight: 600; }
.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.dial { background: var(--plate); border: 1px solid var(--line); border-radius: 20px; padding: 12px 10px 10px; text-align: center; }
.dial .v { font-size: 56px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; }
.dial .v small { font-size: 18px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.dial .steps { display: flex; gap: 8px; margin-top: 8px; }
.dial .steps button { flex: 1; height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--field-work); color: var(--ink); font: inherit; font-size: 22px; font-weight: 700; }

/* ── 3/4 REST ──────────────────────────────────────────────────────────── */
.saved { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink-2); margin-top: 4px; }
.saved b { color: var(--ink); }
.saved .tick { width: 22px; height: 22px; border-radius: 11px; border: 2px solid var(--ink-2); display: grid; place-items: center; font-size: 12px; color: var(--ink); }
.clock { position: relative; width: 268px; height: 268px; margin: 26px auto 0; }
.clock svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.clock .t { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.clock .t .meta { color: var(--system); letter-spacing: .2em; }
.clock .t div { font-size: 84px; font-weight: 800; letter-spacing: -.03em; line-height: 1; margin-top: 6px; }
.clock .t span { font-size: 13px; color: var(--ink-3); margin-top: 8px; }
.clock.small { width: 168px; height: 168px; margin-top: 14px; }
.clock.small .t div { font-size: 52px; }
.up { margin-top: 22px; background: var(--plate-rest); border-radius: 16px; padding: 14px 16px; border: 1px solid #24465C; }
.up .meta { color: var(--ink-3); }
.up p { font-size: 20px; font-weight: 700; margin-top: 4px; }
.up p span { color: var(--ink-2); font-weight: 500; font-size: 16px; }
.up p.meta { font-size: 12px; font-weight: 600; margin-top: 0; color: var(--ink-3); }
.up p.nx-name { font-size: 26px; font-weight: 800; margin-top: 6px; line-height: 1.1; }
.up p.nx-meta { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-top: 6px; }
.up p.nx-guide { font-size: 15px; color: var(--system); font-weight: 600; margin-top: 10px; }
.nw, .up p .nw { white-space: nowrap; color: inherit; font-weight: inherit; font-size: inherit; }
.swap { display: flex; justify-content: space-between; align-items: center; min-height: 48px; margin-top: 8px; border-top: 1px solid #24465C; color: var(--ink); font-size: 15px; }
.swap span { color: var(--ink-2); }

/* ── 5 COMPLETE ────────────────────────────────────────────────────────── */
.c-mark { width: 64px; height: 64px; border-radius: 32px; border: 3px solid var(--ink); display: grid; place-items: center; font-size: 30px; margin-top: 26px; }
.c-title { font-size: 40px; font-weight: 800; margin-top: 18px; letter-spacing: -.02em; }
.c-sub { font-size: 17px; color: var(--ink-2); margin-top: 6px; }
.ledger { margin-top: 26px; border-top: 1px solid var(--line); }
.ledger div { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 16px; color: var(--ink-2); }
.ledger div b { font-size: 22px; color: var(--ink); font-weight: 700; }
.ledger div b.sys { color: var(--system); }
.zones { margin-top: 18px; font-size: 15px; color: var(--ink-2); line-height: 1.5; }
.zones .meta { display: block; margin-bottom: 4px; }

@media (prefers-reduced-motion: no-preference) {
  .device { transition: background-color 240ms ease-out; }
}
</style>
</head>
<body>
